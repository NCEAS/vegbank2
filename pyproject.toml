[project]
name = "vegbank"
version = "2.1.2"
description = "VegBank database and data access service"
authors = [
    { name = "Robert Shelton", email = "shelton@nceas.ucsb.edu" },
    { name = "Dou Mok", email = "douming.mok@gmail.com" },
    { name = "Jim Regetz", email = "regetz@nceas.ucsb.edu" },
    { name = "Matthew B. Jones", email = "jones@nceas.ucsb.edu" },
]
license = { text = "Apache-2.0" }
requires-python = ">=3.13"

dependencies = [
    "psycopg>=3.3.4",
    "flask>=3.1.2",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "numpy>=2.4.6",
    "authlib>=1.7.2",
    "requests>=2.34.2",
    "adbc-driver-postgresql>=1.11.0",
    "gunicorn>=26.0.0",
    "lxml>=6.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pylint>=4.0.6",
    "black>=26.5.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vegbank"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
